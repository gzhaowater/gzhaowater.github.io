<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — XNKK Photos</title>
  <!-- To switch from placeholder auth to the office server, set this BEFORE auth.js:
       <script>window.XNKK_API_BASE = 'https://photos.office.example';</script> -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', Times, serif;
      background: linear-gradient(160deg, #f5f7fa 0%, #e4ebf2 100%);
      color: #2c3e50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(26, 82, 118, 0.12),
                  0 2px 6px rgba(0, 0, 0, 0.05);
      padding: 36px 32px 28px;
    }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #1a5276;
    }
    .header .subtitle {
      margin-top: 6px;
      font-size: 0.9em;
      color: #7f8c8d;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 0.85em;
      font-weight: 600;
      color: #34495e;
      letter-spacing: 0.3px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      font-size: 1em;
      font-family: inherit;
      color: #2c3e50;
      background: #f9fbfc;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    input:focus {
      outline: none;
      border-color: #2980b9;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.18);
    }

    .actions { margin-top: 22px; }
    button.primary {
      width: 100%;
      padding: 12px 16px;
      font-size: 1em;
      font-family: inherit;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #1a5276, #2980b9);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 80ms ease, box-shadow 120ms ease;
    }
    button.primary:hover:not(:disabled) {
      box-shadow: 0 6px 14px rgba(41, 128, 185, 0.35);
    }
    button.primary:active:not(:disabled) { transform: translateY(1px); }
    button.primary:disabled { opacity: 0.7; cursor: progress; }

    .status {
      margin-top: 16px;
      min-height: 1.4em;
      font-size: 0.9em;
      text-align: center;
    }
    .status.error { color: #c0392b; }
    .status.ok    { color: #1e8449; }

    .hint {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px dashed #d0d7de;
      font-size: 0.78em;
      color: #95a5a6;
      text-align: center;
      line-height: 1.5;
    }
    .hint code {
      background: #eef2f5;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: Menlo, Consolas, monospace;
      font-size: 0.95em;
      color: #34495e;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header class="header">
      <h1>XNKK Photos</h1>
      <div class="subtitle">Sign in to view the gallery</div>
    </header>

    <form id="login-form" autocomplete="on" novalidate>
      <label for="user">Username</label>
      <input id="user" name="user" type="text" autocomplete="username"
             required spellcheck="false" autocapitalize="off">

      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password"
             required>

      <div class="actions">
        <button class="primary" type="submit" id="submit-btn">Sign in</button>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
    </form>

    <p class="hint">
      This page gates a private photo archive.
      When the office authentication server is online, set
      <code>window.XNKK_API_BASE</code> in <code>auth.js</code> to switch from
      placeholder auth to server-side login.
    </p>
  </main>

  <script src="./auth.js"></script>
  <script>
    (function () {
      const form    = document.getElementById('login-form');
      const userEl  = document.getElementById('user');
      const passEl  = document.getElementById('pass');
      const btn     = document.getElementById('submit-btn');
      const status  = document.getElementById('status');

      // Already signed in? Jump straight to the gallery.
      if (window.XNKK_AUTH && window.XNKK_AUTH.isAuthenticated()) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        window.location.replace(next || './gallery.html');
        return;
      }

      function setStatus(msg, kind) {
        status.textContent = msg || '';
        status.className = 'status' + (kind ? ' ' + kind : '');
      }

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        setStatus('Signing in…', '');
        btn.disabled = true;

        try {
          const result = await window.XNKK_AUTH.login(userEl.value, passEl.value);
          if (!result.ok) {
            setStatus(result.error, 'error');
            passEl.select();
            return;
          }
          setStatus('Welcome. Redirecting…', 'ok');
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          // small delay so the user sees the "Welcome" message
          setTimeout(() => window.location.replace(next || './gallery.html'), 250);
        } catch (err) {
          setStatus('Unexpected error: ' + err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
