# main links
# `title` is a flat key into _data/i18n.yml, resolved per page language
#   {{ site.data.i18n[lang][link.title] }}
# `i18n: true`  -> on English pages the URL gets the /en/ prefix
# `i18n: false` -> link always points at the (Chinese-only) target
main:
  - title: nav.home
    url: /
    i18n: true

  - title: nav.resume
    url: /cv/
    i18n: true

  - title: nav.publications
    url: /publications/
    i18n: true

  - title: nav.projects
    url: /projects/
    i18n: true

  - title: nav.data_model
    url: /year-archive/
    i18n: true

  - title: nav.gallery
    url: /portfolio/
    i18n: false

  - title: nav.contact
    url: /markdown/
    i18n: true
